spring:
  application:
    name: notice-lens
  datasource:
    url: jdbc:postgresql://localhost:5000/noticelens
    username: noticelens
    password: noticelens
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:8b
          num-ctx: 8192
          temperature: 0.1
      embedding:
        options:
          model: bge-m3
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  storage:
    path: ./uploads